<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>为肖制作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --pink-deep:   #e8789a;
    --pink-mid:    #f4a0b8;
    --pink-light:  #fce4ec;
    --pink-pale:   #fff0f5;
    --petal:       #ffd6e4;
    --gold:        #d4a46a;
    --ink:         #5a3a4a;
  }

  body {
    min-height: 100vh;
    background: var(--pink-pale);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Ma Shan Zheng', cursive;
    overflow: hidden;
    position: relative;
  }

  /* ── Floating petals background ── */
  .petal {
    position: fixed;
    width: 12px;
    height: 18px;
    background: radial-gradient(ellipse at 40% 30%, #ffcce0, #f9a8c9aa);
    border-radius: 0 60% 60% 60%;
    opacity: 0;
    animation: fall linear infinite;
    pointer-events: none;
  }
  @keyframes fall {
    0%   { transform: translateY(-60px) rotate(0deg); opacity: .7; }
    100% { transform: translateY(110vh)  rotate(360deg); opacity: 0; }
  }

  /* ── Scene wrapper ── */
  .scene {
    position: relative;
    width: 340px;
    height: 240px;
    cursor: pointer;
    perspective: 800px;
  }

  /* ── ENVELOPE ── */
  .envelope {
    position: absolute;
    inset: 0;
    filter: drop-shadow(0 12px 32px #e8789a55);
    transition: filter .3s;
  }
  .scene:hover .envelope { filter: drop-shadow(0 18px 42px #e8789a88); }

  /* bottom body */
  .env-body {
    position: absolute;
    bottom: 0; left: 0;
    width: 340px; height: 200px;
    background: linear-gradient(160deg, #f8b8ce 0%, #f095b6 60%, #e87099 100%);
    border-radius: 4px 4px 12px 12px;
    overflow: hidden;
  }
  .env-body::before {              /* left triangle */
    content: '';
    position: absolute;
    bottom: 0; left: 0;
    border-style: solid;
    border-width: 200px 0 0 170px;
    border-color: transparent transparent transparent #f07aaa;
  }
  .env-body::after {               /* right triangle */
    content: '';
    position: absolute;
    bottom: 0; right: 0;
    border-style: solid;
    border-width: 200px 170px 0 0;
    border-color: transparent #f07aaa transparent transparent;
  }

  /* bottom-center V fold */
  .env-bottom-fold {
    position: absolute;
    bottom: 0; left: 50%; transform: translateX(-50%);
    width: 0; height: 0;
    border-style: solid;
    border-width: 0 170px 110px 170px;
    border-color: transparent transparent #e06090 transparent;
  }

  /* flap (top) */
  .env-flap {
    position: absolute;
    top: 0; left: 0;
    width: 340px; height: 140px;
    transform-origin: top center;
    transform-style: preserve-3d;
    transition: transform .7s cubic-bezier(.4,0,.2,1);
    z-index: 10;
  }
  .env-flap-shape {
    position: absolute;
    inset: 0;
    background: linear-gradient(170deg, #f9c8d8 0%, #f095b6 100%);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    border-radius: 4px 4px 0 0;
  }
  /* flap inner (visible when open) */
  .env-flap-shape::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(170deg, #fce4ec 0%, #f9b8ce 100%);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform: rotateX(180deg) scaleY(-1);
  }

  /* label on envelope */
  .env-label {
    position: absolute;
    bottom: 30px;
    left: 50%; transform: translateX(-50%);
    z-index: 5;
    text-align: center;
    color: #fff;
    font-size: 22px;
    letter-spacing: 4px;
    text-shadow: 0 2px 8px #c05070;
    white-space: nowrap;
    transition: opacity .3s;
  }

  /* heart seal */
  .seal {
    position: absolute;
    top: 110px; left: 50%; transform: translateX(-50%);
    z-index: 15;
    font-size: 28px;
    filter: drop-shadow(0 2px 6px #c0507088);
    transition: transform .4s, opacity .4s;
  }

  /* ── OPEN STATE ── */
  .scene.open .env-flap {
    transform: rotateX(-175deg);
  }
  .scene.open .env-label { opacity: 0; }
  .scene.open .seal { transform: translateX(-50%) scale(0); opacity: 0; }

  /* ── LETTER ── */
  .letter {
    position: absolute;
    left: 22px;
    bottom: 10px;
    width: 296px;
    min-height: 220px;
    background: linear-gradient(170deg, #fff9f0 0%, #fff3f7 100%);
    border-radius: 4px;
    padding: 28px 24px 24px;
    z-index: 2;
    transform: translateY(0px);
    opacity: 0;
    transition: transform .65s cubic-bezier(.2,.8,.3,1) .35s,
                opacity  .4s ease .35s;
    box-shadow: 0 4px 24px #e8789a33;
    pointer-events: none;
  }
  .letter::before {               /* ruled lines */
    content: '';
    position: absolute;
    inset: 52px 16px 16px;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 27px,
      #f4c0d022 28px
    );
  }
  .scene.open .letter {
    transform: translateY(-195px);
    opacity: 1;
    pointer-events: all;
  }

  .letter-deco {
    text-align: center;
    font-size: 18px;
    color: var(--pink-deep);
    margin-bottom: 14px;
    letter-spacing: 2px;
  }

  .letter-text {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 15.5px;
    line-height: 1.95;
    color: var(--ink);
    text-align: justify;
    position: relative;
    z-index: 1;
  }

  .letter-sign {
    margin-top: 16px;
    text-align: right;
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 15px;
    color: var(--pink-deep);
    letter-spacing: 1px;
  }

  /* hint text */
  .hint {
    position: fixed;
    bottom: 32px;
    left: 50%; transform: translateX(-50%);
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 14px;
    color: #d4899a;
    letter-spacing: 2px;
    animation: pulse 2s ease-in-out infinite;
    pointer-events: none;
    transition: opacity .4s;
  }
  .hint.hidden { opacity: 0; }
  @keyframes pulse {
    0%,100% { opacity: .6; transform: translateX(-50%) translateY(0); }
    50%      { opacity: 1;  transform: translateX(-50%) translateY(-4px); }
  }
</style>
</head>
<body>

<!-- floating petals -->
<script>
  (function(){
    for(let i=0;i<18;i++){
      const p=document.createElement('div');
      p.className='petal';
      p.style.left=Math.random()*100+'vw';
      p.style.animationDuration=(6+Math.random()*10)+'s';
      p.style.animationDelay=(Math.random()*12)+'s';
      p.style.transform=`rotate(${Math.random()*360}deg) scale(${.6+Math.random()*.8})`;
      document.body.appendChild(p);
    }
  })();
</script>

<div class="scene" id="scene" title="点击打开">
  <!-- envelope body -->
  <div class="envelope">
    <div class="env-body"></div>
    <div class="env-bottom-fold"></div>

    <!-- flap -->
    <div class="env-flap">
      <div class="env-flap-shape"></div>
    </div>

    <!-- label -->
    <div class="env-label">为肖制作</div>

    <!-- heart seal -->
    <div class="seal">🩷</div>
  </div>

  <!-- letter (hidden until open) -->
  <div class="letter" id="letter">
    <div class="letter-deco">· · ✦ · ·</div>
    <p class="letter-text">
      这个网站是我专门为你制作的，因为我不善于表达某些情感，有时我也很害羞，但我以前是程序员，所以对我来说制作网站比较容易。
      <br><br>
      但我建这个网站是想邀请你下个月抽出一天时间去游乐园游玩。当然，门票和出租车费我会自己付。
    </p>
    <div class="letter-sign">— 真诚地 🩷</div>
  </div>
</div>

<div class="hint" id="hint">点击信封打开 ✦</div>

<script>
  const scene = document.getElementById('scene');
  const hint  = document.getElementById('hint');

  scene.addEventListener('click', () => {
    scene.classList.toggle('open');
    hint.classList.add('hidden');
  });
</script>

</body>
</html>
